schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  vale.nvim: a Neovim plugin (Lua, Neovim >= 0.12): a theme engine (plain-data palettes
  plus semantic roles -> colorschemes with plugin integrations) and the vale studio, a
  browser page served by Neovim for creating and editing themes. Dependencies: Neovim
  only. Bundled themes live in the plugin and are read-only; user themes and generated
  loaders live in configurable directories (default: the Neovim configuration).
  Behaviour contracts: openspec/specs/vale-engine/spec.md, openspec/specs/vale-studio/spec.md.
  Code: lua/vale/; user docs in README.md and doc/vale.txt (:help vale). Keep both in
  step with behaviour.
  Tests: headless, no framework: `make test` (nvim --headless -u NONE -l tests/run.lua).
  Also `make fmt-check` (stylua); modules carry LuaCATS annotations.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
